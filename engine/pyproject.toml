[project]
name = "hy-memory-omni-engine"
version = "0.1.0"
authors = [{ name = "YY" }]
requires-python = ">=3.14"
dependencies = ["pydantic==2.14.1", "numpy==2.4.6", "openai==2.54.0", "httpx==0.28.1", "pyyaml", "json-repair", "langdetect", "rank-bm25", "jieba"]

[dependency-groups]
dev = ["workers-py==1.17.9", "workers-runtime-sdk==1.9.5"]

# Deploy/dev implicitly sync too; the pinned pure-Python dependencies include sdists.
[tool.pywrangler]
allow-build = true
